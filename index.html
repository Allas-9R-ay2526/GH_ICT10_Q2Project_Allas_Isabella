<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Seatwork</title>
</head>
<body>
<style>
    nav {
        background-color: #5D4037;
        padding: 15px;
        text-align: center;
        border-radius: 8px;
    }

    nav a {
        color: #F5E6D3;
        text-decoration: none;
        padding: 10px 18px;
        margin: 0 5px;
        font-size: 16px;
        font-weight: bold;
        display: inline-block;
        transition: 0.3s;
    }

    nav a:hover {
        background-color: #8D6E63;
        color: white;
        border-radius: 5px;
    }

    nav a.active {
        background-color: #A1887F;
        color: white;
        border-radius: 5px;
    }
</style>

<nav>
    <a href="index.html" class="active">Homepage</a>
    <a href="elchecker.html">Element Checker</a>
    <a href="club_checker.html">Club Members</a>
    <a href="meet_the_creator.html">Meet the Creator</a>
</nav>

<div id="div1" style="
    color: #4E342E;
    font-size: 25px;
    background-color: #D7CCC8;
    padding: 40px;
    margin: 40px auto;
    max-width: 700px;
    text-align: center;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
">

    <h1>Find Out the Following Countries' Nicknames!</h1>

    <h3>Pick a Country</h3>

    <select id="country" style="
        padding: 12px;
        font-size: 18px;
        background-color: #EFEBE9;
        color: #4E342E;
        border: 2px solid #8D6E63;
        border-radius: 8px;
        width: 220px;
    ">
        <option value="0">Philippines</option>
        <option value="1">Japan</option>
        <option value="2">South Korea</option>
        <option value="3">North Korea</option>
        <option value="4">Thailand</option>
        <option value="5">Taiwan</option>
        <option value="6">Hong Kong</option>
        <option value="7">Indonesia</option>
    </select>

    <br><br>

    <button py-click="show_nick" style="
        background-color: #795548;
        color: white;
        padding: 12px 30px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    ">
        Nickname
    </button>

</div>

<div id="result" style="
    color: #4E342E;
    font-size: 25px;
    background-color: #EFEBE9;
    padding: 30px;
    margin: 40px auto;
    max-width: 700px;
    text-align: center;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
">
</div>

    <py-script src="main.py"></py-script>
</body>
</html>
